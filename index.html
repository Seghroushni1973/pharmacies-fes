<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacies de Fès</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Carte centrée sur Fès
  const map = L.map('map').setView([34.0331, -5.0003], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; contributeurs OpenStreetMap'
  }).addTo(map);

  // Chargement des pharmacies
  fetch('pharmacies_fes.geojson')
    .then(r => r.json())
    .then(data => {
      const couche = L.geoJSON(data, {
        pointToLayer: (feature, latlng) =>
          L.circleMarker(latlng, {
            radius: 6,
            color: '#0a7d32',
            fillColor: '#2ecc71',
            fillOpacity: 0.9,
            weight: 2
          }),
        onEachFeature: (feature, layer) => {
          const nom = (feature.properties && feature.properties.name) || 'Pharmacie (nom inconnu)';
          layer.bindPopup(nom);
        }
      }).addTo(map);
      map.fitBounds(couche.getBounds());
    })
    .catch(err => alert('Erreur de chargement des pharmacies : ' + err));
</script>
</body>
</html>
