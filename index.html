<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacies de Fès</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7d32">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #modes {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 1000;
    display: flex; background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  #modes button {
    border: 0; background: #fff; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  #modes button.actif { background: #0a7d32; color: #fff; font-weight: 700; }
  /* Bouton Délégué masqué pour l'instant : supprimer la ligne suivante pour le ré-afficher */
  #btnDelegue { display: none; }
  #panneau {
    position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000;
    background: #fff; border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3); font-size: 14px; line-height: 1.4;
  }
  #panneau .ok { color: #0a7d32; font-weight: 700; }
  #panneau .non { color: #c0392b; font-weight: 700; }
  #panneau small { color: #666; display: block; margin-top: 4px; }
  #panneau select { font-size: 14px; padding: 4px; margin-top: 6px; }
  .pop { min-width: 210px; font-size: 14px; }
  .pop h4 { margin: 0 0 8px; font-size: 15px; }
  .pop label { display: block; margin: 6px 0 2px; font-size: 13px; color: #444; }
  .pop select, .pop input[type=date], .pop textarea {
    width: 100%; box-sizing: border-box; font-size: 14px; padding: 5px;
  }
  .pop textarea { height: 60px; resize: vertical; }
  .pop .ligne { display: flex; gap: 6px; margin-top: 10px; }
  .pop button { flex: 1; padding: 8px; font-size: 14px; border: 0; border-radius: 6px; cursor: pointer; }
  .pop .sauver { background: #0a7d32; color: #fff; font-weight: 700; }
  .pop .effacer { background: #eee; }
  .btn-iti { display: block; margin-top: 10px; padding: 10px; text-align: center; background: #1a73e8; color: #fff !important; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px; }
  #panneau button.eff { float: right; border: 0; background: #eee; border-radius: 14px; padding: 5px 11px; font-size: 13px; cursor: pointer; margin-left: 8px; }
  #panneau label.test { display: block; margin-top: 6px; font-size: 13px; color: #333; }
  .btn-pos { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .legende span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<div id="modes">
  <button id="btnPharmacien" class="actif">Pharmacien</button>
  <button id="btnDelegue">Délégué</button>
</div>
<div id="panneau"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const RAYON = 300;
  const CLE = 'visites_pharmacies_fes';
  const COULEURS = { aucun: '#2ecc71', a_visiter: '#f39c12', visitee: '#2980b9' };

  const map = L.map('map', { renderer: L.canvas({ tolerance: 12 }) }).setView([34.0331, -5.0003], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; contributeurs OpenStreetMap'
  }).addTo(map);

  const panneau = document.getElementById('panneau');
  const pharmacies = []; // { id, nom, latlng, layer }
  let mode = 'pharmacien';
  let marqueur = null, cercle = null, ligne = null;
  let filtre = 'toutes';
  let testActif = true;      // test 300 m en touchant la carte
  let maPosition = null;     // { latlng, precision }
  let pointMoi = null, cercleMoi = null;

  // ---------- Stockage local (téléphone) ----------
  let donnees = {};
  try { donnees = JSON.parse(localStorage.getItem(CLE) || '{}'); } catch (e) { donnees = {}; }
  function sauver() {
    try { localStorage.setItem(CLE, JSON.stringify(donnees)); } catch (e) {}
  }
  function infos(id) { return donnees[id] || { statut: 'aucun', fav: false, date: '', note: '' }; }

  function nettoyer(nom) {
    const n = (nom || '').replace(/\?+/g, '').replace(/\s+/g, ' ').trim();
    return n || 'Pharmacie (nom inconnu)';
  }

  // ---------- Style des points ----------
  function styler(p) {
    const i = infos(p.id);
    p.layer.setStyle({
      radius: i.fav ? 9 : 6,
      fillColor: COULEURS[i.statut] || COULEURS.aucun,
      color: i.fav ? '#f1c40f' : '#333',
      weight: i.fav ? 4 : 2,
      fillOpacity: 0.95
    });
  }

  function visible(p) {
    const i = infos(p.id);
    if (mode === 'pharmacien' || filtre === 'toutes') return true;
    if (filtre === 'a_visiter') return i.statut === 'a_visiter';
    if (filtre === 'visitee') return i.statut === 'visitee';
    if (filtre === 'non_visitee') return i.statut !== 'visitee';
    if (filtre === 'favorites') return i.fav;
    return true;
  }

  function rafraichir() {
    pharmacies.forEach(p => {
      styler(p);
      const dedans = couche.hasLayer(p.layer);
      if (visible(p) && !dedans) couche.addLayer(p.layer);
      if (!visible(p) && dedans) couche.removeLayer(p.layer);
    });
    afficherPanneau();
  }

  // ---------- Panneaux ----------
  function afficherPanneau(resultatHtml) {
    if (mode === 'pharmacien') {
      if (resultatHtml) {
        panneau.innerHTML = resultatHtml;
        return;
      }
      let proche = '';
      if (maPosition && pharmacies.length) {
        const r = plusProche(maPosition.latlng);
        if (r.pharmacie) {
          proche = '<div>\u{1F4CD} Près de toi : <b>' + r.pharmacie.nom + '</b> · ' + Math.round(r.distance) + ' m</div>' +
            '<a class="btn-iti" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' +
            r.pharmacie.latlng.lat + ',' + r.pharmacie.latlng.lng + '&travelmode=walking">\u{1F9ED} Y aller</a>';
        }
      }
      panneau.innerHTML = proche +
        (maPosition ? '<button type="button" class="eff" id="testIci" style="float:none;margin:6px 8px 0 0">Tester ma position</button>' : '') +
        '<label class="test"><input type="checkbox" id="testActif"' + (testActif ? ' checked' : '') + '> Test 300 m (cercle au toucher)</label>' +
        '<small>' + (testActif
          ? 'Touchez une pharmacie pour voir son cercle de 300 m, ou un endroit vide pour tester l’emplacement.'
          : 'Mode consultation : touchez une pharmacie pour voir son nom et son téléphone.') +
        ' Résultat indicatif, pas une certification légale.</small>';
      const bi = document.getElementById('testIci');
      if (bi) bi.addEventListener('click', () => { testerPoint(maPosition.latlng); });
      document.getElementById('testActif').addEventListener('change', (e) => {
        testActif = e.target.checked;
        if (!testActif) effacerTest();
        afficherPanneau();
      });
      return;
    }
    let v = 0, a = 0, f = 0;
    pharmacies.forEach(p => {
      const i = infos(p.id);
      if (i.statut === 'visitee') v++;
      if (i.statut === 'a_visiter') a++;
      if (i.fav) f++;
    });
    panneau.innerHTML =
      '<div><b>' + v + '</b> visitées · <b>' + a + '</b> à visiter · <b>' + f + '</b> favorites</div>' +
      '<div class="legende"><span style="background:' + COULEURS.aucun + '"></span>aucun' +
      '<span style="background:' + COULEURS.a_visiter + '"></span>à visiter' +
      '<span style="background:' + COULEURS.visitee + '"></span>visitée' +
      '<span style="background:#fff;border:3px solid #f1c40f"></span>favorite</div>' +
      '<select id="filtre">' +
      opt('toutes', 'Afficher : toutes') +
      opt('a_visiter', 'Afficher : à visiter') +
      opt('visitee', 'Afficher : visitées') +
      opt('non_visitee', 'Afficher : non visitées') +
      opt('favorites', 'Afficher : favorites') +
      '</select>' +
      '<small>Touchez une pharmacie pour la modifier. Données enregistrées sur ce téléphone.</small>';
    document.getElementById('filtre').addEventListener('change', (e) => {
      filtre = e.target.value;
      rafraichir();
    });
  }
  function opt(v, t) { return '<option value="' + v + '"' + (filtre === v ? ' selected' : '') + '>' + t + '</option>'; }

  // ---------- Itinéraire (ouvre Google Maps / l'appli Maps du téléphone) ----------
  function boutonItineraire(p) {
    const a = document.createElement('a');
    a.className = 'btn-iti';
    a.textContent = '\u{1F9ED} Itinéraire';
    a.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p.latlng.lat + ',' + p.latlng.lng + '&travelmode=driving';
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function ligneTel(p) {
    const d = document.createElement('div');
    d.style.margin = '0 0 6px';
    if (p.tel) {
      const premier = p.tel.split(/[;,\/]/)[0].replace(/[^\d+]/g, '');
      const a = document.createElement('a');
      a.href = 'tel:' + premier;
      a.textContent = '\u{1F4DE} ' + p.tel;
      a.style.fontWeight = '700';
      d.appendChild(a);
    } else {
      d.textContent = 'Téléphone non renseigné';
      d.style.color = '#888';
    }
    return d;
  }

  function popupSimple(p) {
    const div = document.createElement('div');
    div.className = 'pop';
    const h = document.createElement('h4');
    h.textContent = p.nom;
    div.appendChild(h);
    div.appendChild(ligneTel(p));
    div.appendChild(boutonItineraire(p));
    return div;
  }

  // ---------- Formulaire délégué ----------
  function formulaire(p) {
    const i = infos(p.id);
    const div = document.createElement('div');
    div.className = 'pop';
    div.innerHTML =
      '<h4></h4>' +
      '<label>Statut</label>' +
      '<select class="statut">' +
        '<option value="aucun">Aucun</option>' +
        '<option value="a_visiter">À visiter</option>' +
        '<option value="visitee">Visitée</option>' +
      '</select>' +
      '<label>Date de la dernière visite</label>' +
      '<input type="date" class="date">' +
      '<label><input type="checkbox" class="fav"> ★ Favorite</label>' +
      '<label>Note (médecin rencontré, produit, rappel)</label>' +
      '<textarea class="note"></textarea>' +
      '<div class="ligne"><button class="sauver">Enregistrer</button><button class="effacer">Effacer</button></div>';
    div.querySelector('h4').textContent = p.nom;
    div.querySelector('h4').after(ligneTel(p));
    const sStatut = div.querySelector('.statut');
    const sDate = div.querySelector('.date');
    const sFav = div.querySelector('.fav');
    const sNote = div.querySelector('.note');
    sStatut.value = i.statut; sDate.value = i.date; sFav.checked = i.fav; sNote.value = i.note;

    // Si on passe à "Visitée" sans date, mettre la date du jour
    sStatut.addEventListener('change', () => {
      if (sStatut.value === 'visitee' && !sDate.value) {
        sDate.value = new Date().toISOString().slice(0, 10);
      }
    });
    div.querySelector('.sauver').addEventListener('click', () => {
      donnees[p.id] = { statut: sStatut.value, fav: sFav.checked, date: sDate.value, note: sNote.value };
      sauver(); map.closePopup(); rafraichir();
    });
    div.querySelector('.effacer').addEventListener('click', () => {
      delete donnees[p.id];
      sauver(); map.closePopup(); rafraichir();
    });
    div.appendChild(boutonItineraire(p));
    return div;
  }

  // ---------- Mode pharmacien : clic sur la carte ----------
  function plusProche(latlng) {
    let meilleure = null, dmin = Infinity;
    for (const p of pharmacies) {
      const d = map.distance(latlng, p.latlng);
      if (d < dmin) { dmin = d; meilleure = p; }
    }
    return { pharmacie: meilleure, distance: dmin };
  }
  function effacerTest() {
    [marqueur, cercle, ligne].forEach(l => l && map.removeLayer(l));
    marqueur = cercle = ligne = null;
  }
  function testerPoint(latlng) {
    const { pharmacie, distance } = plusProche(latlng);
    const respecte = distance >= RAYON;
    effacerTest();
    marqueur = L.marker(latlng, { interactive: false, keyboard: false }).addTo(map);
    cercle = L.circle(latlng, { radius: RAYON, color: respecte ? '#0a7d32' : '#c0392b', fillOpacity: 0.1, interactive: false }).addTo(map);
    ligne = L.polyline([latlng, pharmacie.latlng], { color: '#333', dashArray: '5,6', weight: 2, interactive: false }).addTo(map);
    afficherPanneau(
      '<button type="button" class="eff" id="effTest">\u2715 Effacer</button>' +
      '<div>Pharmacie la plus proche : <b>' + pharmacie.nom + '</b></div>' +
      '<div>Distance : <b>' + Math.round(distance) + ' m</b></div>' +
      '<div class="' + (respecte ? 'ok' : 'non') + '">' +
      (respecte ? 'Règle des 300 m respectée' : 'Trop proche : moins de 300 m') + '</div>' +
      (respecte
        ? '<a class="btn-iti" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' +
          latlng.lat.toFixed(6) + ',' + latlng.lng.toFixed(6) + '&travelmode=driving">\u{1F9ED} Itinéraire vers cet emplacement</a>'
        : '') +
      '<small>Résultat indicatif (mesure depuis le point, pas la façade). Pas une certification légale.</small>'
    );
    document.getElementById('effTest').addEventListener('click', () => { effacerTest(); afficherPanneau(); });
  }
  map.on('click', (e) => {
    if (mode !== 'pharmacien' || !pharmacies.length || !testActif) return;
    testerPoint(e.latlng);
  });

  // Toucher une pharmacie (test 300 m actif) : cercle de 300 m autour d'elle + pharmacies voisines
  function zonePharmacie(p) {
    effacerTest();
    cercle = L.circle(p.latlng, { radius: RAYON, color: '#c0392b', fillOpacity: 0.1, interactive: false }).addTo(map);
    const voisines = pharmacies
      .filter(q => q !== p)
      .map(q => ({ q, d: map.distance(p.latlng, q.latlng) }))
      .filter(x => x.d < RAYON)
      .sort((a, b) => a.d - b.d);
    let liste = '';
    voisines.slice(0, 5).forEach(x => { liste += '<div>• ' + x.q.nom + ' : ' + Math.round(x.d) + ' m</div>'; });
    if (voisines.length > 5) liste += '<div>… et ' + (voisines.length - 5) + ' autres</div>';
    afficherPanneau(
      '<button type="button" class="eff" id="effTest">\u2715 Effacer</button>' +
      '<div><b>' + p.nom + '</b></div>' +
      '<div>Cercle de ' + RAYON + ' m autour de cette pharmacie.</div>' +
      '<div class="' + (voisines.length ? 'non' : 'ok') + '">' +
      (voisines.length ? voisines.length + ' autre(s) pharmacie(s) dans le cercle' : 'Aucune autre pharmacie dans le cercle') + '</div>' +
      liste +
      (p.tel ? '<div><a href="tel:' + p.tel.split(/[;,\/]/)[0].replace(/[^\d+]/g, '') + '">\u{1F4DE} ' + p.tel + '</a></div>' : '') +
      '<small>Touchez ailleurs sur la carte pour tester un autre emplacement.</small>'
    );
    document.getElementById('effTest').addEventListener('click', () => { effacerTest(); afficherPanneau(); });
  }

  // ---------- Changement de mode ----------
  function changerMode(m) {
    mode = m;
    document.getElementById('btnPharmacien').classList.toggle('actif', m === 'pharmacien');
    document.getElementById('btnDelegue').classList.toggle('actif', m === 'delegue');
    map.closePopup();
    effacerTest();
    rafraichir();
  }
  document.getElementById('btnPharmacien').addEventListener('click', () => changerMode('pharmacien'));
  document.getElementById('btnDelegue').addEventListener('click', () => changerMode('delegue'));

  // ---------- Chargement des pharmacies ----------
  const couche = L.layerGroup().addTo(map);
  afficherPanneau();

  fetch('pharmacies_fes.geojson')
    .then(r => r.json())
    .then(data => {
      const bornes = [];
      data.features.forEach(f => {
        if (!f.geometry || f.geometry.type !== 'Point') return;
        const [lon, lat] = f.geometry.coordinates;
        const latlng = L.latLng(lat, lon);
        const nom = nettoyer(f.properties && f.properties.name);
        const tel = ((f.properties && (f.properties.phone || f.properties['contact:phone'])) || '').toString().trim();
        const id = lon.toFixed(6) + ',' + lat.toFixed(6);
        const layer = L.circleMarker(latlng, { radius: 6, bubblingMouseEvents: false });
        const p = { id, nom, tel, latlng, layer };
        layer.on('click', () => {
          // Toucher une pharmacie = ses infos (nom, téléphone, itinéraire), jamais de cercle
          effacerTest();
          L.popup().setLatLng(p.latlng).setContent(mode === 'delegue' ? formulaire(p) : popupSimple(p)).openOn(map);
        });
        pharmacies.push(p);
        bornes.push(latlng);
      });
      map.fitBounds(L.latLngBounds(bornes));
      rafraichir();
    })
    .catch(err => { panneau.textContent = 'Erreur de chargement des pharmacies : ' + err; });
  // ---------- Ma position ----------
  let premiereFois = true;
  const FES = L.latLng(34.0331, -5.0003);
  map.on('locationfound', (e) => {
    maPosition = { latlng: e.latlng, precision: e.accuracy };
    if (!pointMoi) {
      cercleMoi = L.circle(e.latlng, { radius: e.accuracy, color: '#1a73e8', weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
      pointMoi = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(map);
    } else {
      pointMoi.setLatLng(e.latlng);
      cercleMoi.setLatLng(e.latlng).setRadius(e.accuracy);
    }
    // Au premier signal : centrer sur toi seulement si tu es près de Fès (sinon on garde la vue de Fès)
    if (premiereFois) {
      premiereFois = false;
      if (map.distance(e.latlng, FES) < 30000) map.setView(e.latlng, 16);
    }
    if (mode === 'pharmacien' && !marqueur) afficherPanneau();
  });
  map.on('locationerror', () => {});
  map.locate({ watch: true, enableHighAccuracy: true, setView: false, maximumAge: 10000 });

  const ctrlPos = L.control({ position: 'topright' });
  ctrlPos.onAdd = function () {
    const b = L.DomUtil.create('button', 'btn-pos');
    b.type = 'button';
    b.title = 'Ma position';
    b.setAttribute('aria-label', 'Ma position');
    b.textContent = '\u{1F4CD}';
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', () => {
      if (maPosition) map.setView(maPosition.latlng, 16);
      else map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    });
    return b;
  };
  ctrlPos.addTo(map);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
